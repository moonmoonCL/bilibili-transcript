name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Only publish when a version tag (e.g. v1.0.9) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # Trusted publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0.
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN needed: npm authenticates via GitHub OIDC.
      - name: Publish to npm
        run: npm publish --access public --provenance
